<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Electron Soundboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
  <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
</head>

<body class="bg-slate-900 text-slate-100 h-screen flex flex-col select-none overflow-hidden font-sans">

    <!-- 頂部導航列與分頁 Tab -->
    <header class="bg-slate-950 border-b border-slate-800 px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-6">
        <div class="text-indigo-400 font-bold text-lg tracking-wide">Soundboard Studio</div>
        
        <!-- 分頁切換按鈕 -->
        <nav class="flex bg-slate-900 p-1 rounded-lg border border-slate-800 text-xs font-medium">
        <button id="tab-btn-media" onclick="switchTab('media')" class="px-4 py-1.5 rounded-md bg-indigo-600 text-white transition">資源庫</button>
        <button id="tab-btn-editor" onclick="switchTab('editor')" class="px-4 py-1.5 rounded-md text-slate-400 hover:text-slate-200 transition">編輯頁</button>
        <button id="tab-btn-sounds" onclick="switchTab('sounds')" class="px-4 py-1.5 rounded-md text-slate-400 hover:text-slate-200 transition">音效庫</button>
        </nav>
    </div>

    <div class="flex items-center gap-3">
        <!-- 新增：全域停止播放按鈕 -->
        <button onclick="stopAllAudio()" class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white border border-rose-500/30 text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1 font-medium">
        ■ 停止播放
        </button>

        <!-- 輸出音訊裝置選擇器 -->
        <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
        <label class="text-xs text-slate-400">輸出裝置:</label>
        <select id="device-select" class="bg-transparent text-xs text-slate-200 outline-none cursor-pointer max-w-[200px] truncate">
            <option value="default">預設揚聲器</option>
        </select>
        </div>
    </div>
    </header>

  <!-- 主內容區 (三個分頁面板) -->
  <main class="flex-1 p-6 overflow-hidden relative">

    <!-- 分頁 1: 資源庫 (Media Library) -->
    <section id="tab-media" class="h-full flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <!-- 搜尋列 -->
        <input type="text" id="media-search" oninput="filterMediaList()" placeholder="搜尋原始檔案..." class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 outline-none focus:border-indigo-500 w-64">
        
        <!-- 匯入原始檔案 -->
        <input type="file" id="media-file-input" accept="audio/*" class="hidden" multiple onchange="importMediaFiles(event)">
        <button onclick="document.getElementById('media-file-input').click()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-lg transition">
          + 匯入原始檔案
        </button>
      </div>

      <!-- 媒體檔案清單 -->
      <div class="flex-1 bg-slate-950 border border-slate-800 rounded-xl overflow-y-auto p-3 space-y-2" id="media-list">
        <!-- 列表由渲染進程動態生成 -->
      </div>
    </section>

    <!-- 分頁 2: 編輯頁 (Editor) -->
    <section id="tab-editor" class="h-full hidden flex flex-col justify-between">
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-5">
        <div class="flex justify-between items-center mb-4">
          <div>
            <h2 id="editor-source-title" class="text-base font-bold text-indigo-400">未選擇檔案</h2>
            <p class="text-xs text-slate-500">在波形圖上拉選段落，設定起點與終點</p>
          </div>
          <button id="btn-play-editor-region" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg text-slate-200 transition">
            ▶ 試聽選取段落
          </button>
        </div>

        <!-- 波形圖容器 -->
        <div id="waveform" class="w-full bg-slate-900 rounded-lg overflow-hidden border border-slate-800 my-4"></div>
      </div>

        <!-- 音效屬性設定與儲存 -->
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-5 mt-4 flex flex-col gap-4">
        <div class="grid grid-cols-3 gap-4">
            <div>
            <label class="block text-xs text-slate-400 mb-1">音效名稱</label>
            <input type="text" id="sound-name-input" placeholder="例如：爆笑聲" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 outline-none focus:border-indigo-500">
            </div>
            <div>
            <label class="block text-xs text-slate-400 mb-1">快捷鍵 (Shortcut)</label>
            <input type="text" id="sound-shortcut-input" placeholder="例如：F1" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-slate-200 outline-none focus:border-indigo-500">
            </div>
            <!-- 新增：音量控制拉條 -->
            <div>
            <div class="flex justify-between items-center mb-1">
                <label class="text-xs text-slate-400">預設音量</label>
                <span id="volume-display" class="text-xs text-indigo-400 font-mono">50%</span>
            </div>
            <input type="range" id="sound-volume-input" min="0" max="100" value="50" oninput="updateVolumeDisplay(this.value)" class="w-full accent-indigo-500 h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer">
            </div>
        </div>

        <div class="flex justify-between items-center pt-2">
            <div class="text-xs text-slate-400">
            時間範圍: <span id="time-range-display" class="text-indigo-400 font-mono">0.0s - 0.0s</span>
            </div>
            <button onclick="saveSoundConfig()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-5 py-2 rounded-lg font-medium transition shadow-lg shadow-indigo-600/20">
            儲存至音效庫 (生成 JSON)
            </button>
        </div>
        </div>
    </section>

    <!-- 分頁 3: 音效庫 (Sound Library) -->
    <section id="tab-sounds" class="h-full hidden overflow-y-auto">
      <div id="sound-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- 音效卡片動態渲染 -->
      </div>
    </section>

  </main>

  <script src="scripts/renderer.js"></script>
</body>
</html>
